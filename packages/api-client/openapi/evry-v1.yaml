openapi: 3.1.0
info:
  title: EVRY API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: webLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AccessToken' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: webRefresh
      security: []
      responses:
        '200': { $ref: '#/components/responses/AccessToken' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: webLogout
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/mobile/login:
    post:
      operationId: mobileLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/MobileTokens' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/mobile/refresh:
    post:
      operationId: mobileRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200': { $ref: '#/components/responses/MobileTokens' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/mobile/logout:
    post:
      operationId: mobileLogout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /users/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /exercises:
    get:
      operationId: listExercises
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 30 } }
      responses:
        '200':
          description: Paginated exercise catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Exercise' } }
                  nextCursor: { type: [string, 'null'] }
  /routines:
    get:
      operationId: listRoutines
      responses:
        '200':
          description: Routines
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Routine' } }
    post:
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutineInput' }
      responses:
        '201':
          description: Created routine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
  /workouts:
    get:
      operationId: listWorkouts
      responses:
        '200':
          description: Workouts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Workout' } }
    post:
      operationId: createWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                notes: { type: string, maxLength: 2000 }
                routineId: { type: string }
                clientId: { type: string, format: uuid }
      responses:
        '201':
          description: Active workout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '409': { $ref: '#/components/responses/Error' }
  /sync/workouts:
    post:
      operationId: syncWorkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncWorkoutInput' }
      responses:
        '201':
          description: Canonical synchronized workout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncWorkoutResult' }
        '409':
          description: Revision or active-workout conflict
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiError' }
                  - type: object
                    properties:
                      serverVersion: { $ref: '#/components/schemas/Workout' }
  /progress/overview:
    get:
      operationId: progressOverview
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Aggregated progress overview
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /progress/exercises/{id}:
    get:
      operationId: exerciseProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Period'
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25 } }
      responses:
        '200':
          description: Paginated exercise progress
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /cycle/entries:
    get:
      operationId: listCycleEntries
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Cycle entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CycleEntry' } }
    post:
      operationId: upsertCycleEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleEntryInput' }
      responses:
        '201':
          description: Cycle entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleEntry' }
  /cycle/entries/{id}:
    delete:
      operationId: deleteCycleEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /readiness/checkin:
    post:
      operationId: readinessCheckin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Daily readiness
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Period:
      name: period
      in: query
      schema: { type: string, enum: [30d, 90d, 6m, 1y, all], default: 30d }
  responses:
    AccessToken:
      description: Short-lived access token
      content:
        application/json:
          schema:
            type: object
            required: [accessToken]
            properties: { accessToken: { type: string } }
    MobileTokens:
      description: Mobile access and rotating refresh token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MobileTokens' }
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties: { ok: { type: boolean, const: true } }
    Error:
      description: Normalized API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [code, message, retryable, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        retryable: { type: boolean }
        requestId: { type: string, format: uuid }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 64, maxLength: 256 }
    MobileTokens:
      type: object
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, name, trackCycle]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        trackCycle: { type: boolean }
        biologicalSex: { type: string, enum: [MALE, FEMALE, OTHER, PREFER_NOT_SAY] }
    Exercise:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        imagePath: { type: [string, 'null'] }
        gifPath: { type: [string, 'null'] }
        muscleGroup: { type: string }
        equipment: { type: string }
    Routine:
      type: object
      required: [id, name, exercises]
      properties:
        id: { type: string }
        name: { type: string }
        exercises: { type: array, items: { type: object, additionalProperties: true } }
    RoutineInput:
      type: object
      required: [name, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
        exercises: { type: array, maxItems: 100, items: { type: object, additionalProperties: true } }
    WorkoutSet:
      type: object
      required: [id, exerciseId, order, revision]
      properties:
        id: { type: string }
        clientId: { type: [string, 'null'], format: uuid }
        exerciseId: { type: string }
        order: { type: integer }
        revision: { type: integer }
        weightKg: { type: [number, 'null'] }
        reps: { type: [integer, 'null'] }
        durationS: { type: [integer, 'null'] }
        rpe: { type: [integer, 'null'] }
    Workout:
      type: object
      required: [id, name, status, revision, sets, startedAt]
      properties:
        id: { type: string }
        clientId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        revision: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        sets: { type: array, items: { $ref: '#/components/schemas/WorkoutSet' } }
    SyncWorkoutSetInput:
      type: object
      required: [clientId, baseRevision, exerciseId, order]
      properties:
        clientId: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        exerciseId: { type: string }
        order: { type: integer, minimum: 0, maximum: 500 }
        weightKg: { type: [number, 'null'], minimum: 0 }
        reps: { type: [integer, 'null'], minimum: 0 }
        durationS: { type: [integer, 'null'], minimum: 0 }
        rpe: { type: [integer, 'null'], minimum: 1, maximum: 10 }
    SyncWorkoutInput:
      type: object
      required: [clientId, syncId, baseRevision, name, startedAt, status, sets, deletedSetClientIds]
      properties:
        clientId: { type: string, format: uuid }
        syncId: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        name: { type: string, maxLength: 120 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        notes: { type: string, maxLength: 2000 }
        routineId: { type: string }
        sets: { type: array, maxItems: 250, items: { $ref: '#/components/schemas/SyncWorkoutSetInput' } }
        deletedSetClientIds: { type: array, maxItems: 250, items: { type: string, format: uuid } }
    SyncWorkoutResult:
      type: object
      required: [workout, revision, mapping]
      properties:
        workout: { $ref: '#/components/schemas/Workout' }
        revision: { type: integer }
        mapping: { type: object, additionalProperties: true }
    CycleEntry:
      type: object
      required: [id, date]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        flow: { type: string, enum: [NONE, SPOTTING, LIGHT, MEDIUM, HEAVY] }
        symptoms: { type: array, items: { type: string } }
    CycleEntryInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        previousDate: { type: string, format: date }
        flow: { type: string, enum: [NONE, SPOTTING, LIGHT, MEDIUM, HEAVY] }
        symptoms: { type: array, maxItems: 30, items: { type: string, maxLength: 80 } }
        notes: { type: string, maxLength: 2000 }
